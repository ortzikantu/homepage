name: Publish
on:
  push:
    branches:
      - trunk
jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Hugo
        run: |
          HUGO_VERSION=0.164.0
          wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          tar -xzf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          chmod +x hugo
          ./hugo version

      - name: Install Dart Scss
        run: |
          uname -a

      - name: Build site
        run: |
          ./hugo --minify

      - name: Deploy to Codeberg Pages
        uses: actions/git-pages@v2
        with:
          token: ${{ forge.token }}
          source: public/
